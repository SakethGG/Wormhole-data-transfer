<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="58%" stop-color="#ff7a30" stop-opacity="0"/>
      <stop offset="70%" stop-color="#ff7a30" stop-opacity=".16"/>
      <stop offset="85%" stop-color="#7b4dff" stop-opacity=".07"/>
      <stop offset="100%" stop-color="#7b4dff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="disk" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7b4dff"/>
      <stop offset=".3" stop-color="#ff5d8f"/>
      <stop offset=".6" stop-color="#ff9a45"/>
      <stop offset="1" stop-color="#ffe0a0"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffe0a0"/>
      <stop offset=".5" stop-color="#ff8a3c"/>
      <stop offset="1" stop-color="#8a5cff"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="2.2"/></filter>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="7"/></filter>
    <clipPath id="front"><rect x="0" y="128" width="256" height="128"/></clipPath>
  </defs>
  <circle cx="128" cy="128" r="124" fill="url(#halo)"/>
  <!-- disk behind the hole -->
  <g transform="rotate(-18 128 128)">
    <ellipse cx="128" cy="128" rx="114" ry="26" fill="none" stroke="url(#disk)" stroke-width="11" filter="url(#soft)" opacity=".95"/>
  </g>
  <!-- light bent over the top and bottom of the hole -->
  <circle cx="128" cy="128" r="70" fill="none" stroke="url(#ring)" stroke-width="7" filter="url(#soft)"/>
  <circle cx="128" cy="128" r="62" fill="#ff8a3c" opacity=".5" filter="url(#glow)"/>
  <!-- the hole -->
  <circle cx="128" cy="128" r="62" fill="#000"/>
  <circle cx="128" cy="128" r="62" fill="none" stroke="#ffcf8a" stroke-width="2.5"/>
  <!-- front half of the disk crossing over the hole -->
  <g transform="rotate(-18 128 128)" clip-path="url(#front)">
    <ellipse cx="128" cy="128" rx="114" ry="26" fill="none" stroke="url(#disk)" stroke-width="10" filter="url(#soft)"/>
  </g>
</svg>
