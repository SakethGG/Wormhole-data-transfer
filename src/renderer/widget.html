<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'self'; script-src 'self'">
<title>Wormhole</title>
<link rel="stylesheet" href="theme.css">
<link rel="stylesheet" href="widget.css">
</head>
<body>
<div id="hole" class="offline" title="Drop files here. Click to open.">
  <div class="halo"></div>
  <div class="disk"><i></i></div>
  <div class="disk flat"><i></i></div>
  <div class="core"></div>
  <svg id="ring" viewBox="0 0 100 100">
    <circle class="track" cx="50" cy="50" r="46"/>
    <circle class="bar" id="bar" cx="50" cy="50" r="46" pathLength="100"/>
  </svg>
  <div id="dot"></div>
</div>
<script src="widget.js"></script>
</body>
</html>
